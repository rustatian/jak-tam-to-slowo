openapi: 3.1.0
info:
  title: Jak tam to słowo API
  version: 0.1.0
servers:
  - url: https://api.slowo.rustatian.me
  - url: https://api-dev.slowo.rustatian.me
security:
  - cognito: []
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user.
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: The request has no valid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The server could not read or make the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Me:
      type: object
      required: [id, email, displayName, direction]
      properties:
        id:
          type: string
          description: The Cognito user ID (the sub claim of the access token).
        email:
          type: string
          description: The email of the Cognito user.
        displayName:
          type: string
          description: The name that the group sees. Empty until the learner sets it.
        direction:
          type: string
          enum: [ru-pl, pl-ru]
          description: The translation direction of the learner's study.
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
