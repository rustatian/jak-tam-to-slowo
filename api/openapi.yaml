openapi: 3.1.0
info:
  title: Jak tam to słowo API
  version: 0.1.0
servers:
  - url: https://api.slowo.rustatian.me
  - url: https://api-dev.slowo.rustatian.me
security:
  - cognito: []
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user.
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateMe
      summary: Change the profile fields that the body names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: The changed user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/me/ai-consent:
    put:
      operationId: giveAiConsent
      summary: Give the AI consent. A second call keeps the first consent time.
      responses:
        "204":
          description: The consent is stored.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: withdrawAiConsent
      summary: Withdraw the AI consent.
      responses:
        "204":
          description: The user has no AI consent.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups:
    post:
      operationId: createGroup
      summary: Create a group. The signed-in user becomes its first member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroup
      summary: A group that the signed-in user is a member of.
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateGroup
      summary: Change the group fields that the body names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: The changed group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listGroupMembers
      summary: The members of the group.
      responses:
        "200":
          description: The members, in the Polish order of display name, then by ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMembers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: removeGroupMember
      summary: Remove a member. A member who names their own ID leaves. The group is deleted with its last member.
      responses:
        "204":
          description: The user is not a member any more.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/invitations:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: createInvitation
      summary: Invite a person to the group by email. A pending invitation of the same address is replaced. A member can send 20 invitations in one day (UTC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: The new invitation. Its token is only in the email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
    get:
      operationId: listInvitations
      summary: The pending invitations of the group.
      responses:
        "200":
          description: The pending invitations, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitations"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      operationId: cancelInvitation
      summary: Cancel a pending invitation.
      responses:
        "204":
          description: The invitation does not exist any more.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/cards:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: createCard
      summary: Add a translation card to the group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCreate"
      responses:
        "201":
          description: The new card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listCards
      summary: The cards of the group.
      parameters:
        - name: q
          in: query
          description: A part of the Polish or the Russian term. Upper and lower case, the marks of the Polish letters, and ё and е are equal in the search. Without q, or with a q of spaces only, the answer has all cards.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: "The cards of the group that are not archived, in the Polish order of pl, then by ID. With q: the cards whose Polish or Russian term contains q. First the cards with a term that is equal to q, then the cards with a term that starts with q, then the others."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cards"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/cards/{cardId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/CardId"
    patch:
      operationId: updateCard
      summary: Change the card fields that the body names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardUpdate"
      responses:
        "200":
          description: The changed card.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: archiveCard
      summary: Archive a card of the group.
      responses:
        "204":
          description: The card is archived. No route returns it.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    get:
      operationId: previewInvitation
      summary: The group and the inviter of a pending invitation. An invitation that starts a new group has no group and no inviter. The token is the proof, so the call needs no access token.
      security: []
      responses:
        "200":
          description: The group that the invitation is for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/invitations/{token}/acceptance:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    post:
      operationId: acceptInvitation
      summary: Join the group of a pending invitation, or start the group of a new group invitation. An invitation can be accepted one time. A user of another group must confirm that they leave it.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAccept"
      responses:
        "204":
          description: The signed-in user is a member of the group.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      description: The ID of a user (the id of Me and of Member).
      schema:
        type: string
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
    InvitationToken:
      name: token
      in: path
      required: true
      description: The token of an invitation link.
      schema:
        type: string
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The request has no valid access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The signed-in user is not a member of the group.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: The caller is at a request limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: The email service did not accept the message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Direction:
      type: string
      enum: [ru-pl, pl-ru]
      description: The translation direction of the learner's study.
    Me:
      type: object
      required: [id, email, displayName, direction, reminder]
      properties:
        id:
          type: string
          description: The Cognito user ID (the sub claim of the access token).
        email:
          type: string
          description: The email of the Cognito user.
        displayName:
          type: string
          description: The name that the group sees. Empty until the learner sets it.
        direction:
          $ref: "#/components/schemas/Direction"
        reminder:
          type: boolean
          description: The local reminder for due cards is on.
        aiConsentAt:
          type: string
          format: date-time
          description: When the user gave the AI consent. Absent without consent.
        groupId:
          type: string
          description: The group of the user. Absent without a group.
    MeUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: The new display name. Spaces at the ends are removed; then it has 1 to 40 characters, and no control, line-break or text-direction character.
        direction:
          $ref: "#/components/schemas/Direction"
        reminder:
          type: boolean
    Group:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    GroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: The group name. Spaces at the ends are removed; then it has 1 to 40 characters, and no control, line-break or text-direction character.
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: The new group name. Spaces at the ends are removed; then it has 1 to 40 characters, and no control, line-break or text-direction character.
    Member:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          description: The ID of the user.
        displayName:
          type: string
          description: The name that the group sees. Empty until the member sets it.
    GroupMembers:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    Invitation:
      type: object
      required: [id, email, createdAt, expiresAt]
      properties:
        id:
          type: string
        email:
          type: string
          description: The address that the invitation went to, in lower case.
        invitedBy:
          $ref: "#/components/schemas/Member"
          description: The member who sent the invitation. Absent when that account does not exist any more.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: The invitation can be accepted until this time.
        failure:
          type: string
          enum: [bounce, complaint]
          description: A notice of the email service about the invitation email. With bounce the email probably did not arrive, but an automatic reply of the receiver can cause this notice too. With complaint the receiver marked the email as spam. Absent while no such notice came.
    InvitationCreate:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
          description: One email address in ASCII characters. Spaces at the ends are removed, and capital letters become small letters.
    Invitations:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    InvitationPreview:
      type: object
      properties:
        groupId:
          type: string
          description: Absent for an invitation that starts a new group.
        groupName:
          type: string
          description: Absent for an invitation that starts a new group.
        invitedBy:
          type: string
          description: The display name of the member who sent the invitation. Absent when that name is empty or the account does not exist any more.
    InvitationAccept:
      type: object
      properties:
        leaveGroup:
          type: boolean
          description: True confirms that the signed-in user leaves their current group to join this one.
        groupName:
          type: string
          minLength: 1
          maxLength: 40
          description: The name of the new group, with the rule of the group name. Needed for an invitation that starts a new group.
    Card:
      type: object
      required: [id, kind, pl, ru, examplePl, exampleRu, meaningRu, alternativesPl, alternativesRu]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [translation, grammar]
        pl:
          type: string
        ru:
          type: string
        examplePl:
          type: string
        exampleRu:
          type: string
        meaningRu:
          type: string
        alternativesPl:
          type: array
          items:
            type: string
        alternativesRu:
          type: array
          items:
            type: string
    CardCreate:
      type: object
      required: [pl, ru, examplePl, exampleRu, meaningRu]
      properties:
        pl:
          type: string
          minLength: 1
          maxLength: 200
          description: The Polish term. Spaces at the ends are removed; then it has 1 to 200 characters, and no control, line-break or text-direction character.
        ru:
          type: string
          minLength: 1
          maxLength: 200
          description: The Russian term. Spaces at the ends are removed; then it has 1 to 200 characters, and no control, line-break or text-direction character.
        examplePl:
          type: string
          minLength: 1
          maxLength: 500
          description: A Polish example. Spaces at the ends are removed; then it has 1 to 500 characters, and no control, line-break or text-direction character.
        exampleRu:
          type: string
          minLength: 1
          maxLength: 500
          description: A Russian example. Spaces at the ends are removed; then it has 1 to 500 characters, and no control, line-break or text-direction character.
        meaningRu:
          type: string
          minLength: 1
          maxLength: 200
          description: The meaning in Russian. Spaces at the ends are removed; then it has 1 to 200 characters, and no control, line-break or text-direction character.
        alternativesPl:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: At most 8 other Polish terms. Spaces at the ends of each term are removed; then each term has 1 to 200 characters, and no control, line-break or text-direction character. A list that the body does not have is an empty list.
        alternativesRu:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: At most 8 other Russian terms. Spaces at the ends of each term are removed; then each term has 1 to 200 characters, and no control, line-break or text-direction character. A list that the body does not have is an empty list.
    Cards:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
    CardUpdate:
      type: object
      properties:
        pl:
          type: string
          minLength: 1
          maxLength: 200
          description: The Polish term. Spaces at the ends are removed; then it has 1 to 200 characters, and no control, line-break or text-direction character.
        ru:
          type: string
          minLength: 1
          maxLength: 200
          description: The Russian term. Spaces at the ends are removed; then it has 1 to 200 characters, and no control, line-break or text-direction character.
        examplePl:
          type: string
          minLength: 1
          maxLength: 500
          description: A Polish example. Spaces at the ends are removed; then it has 1 to 500 characters, and no control, line-break or text-direction character.
        exampleRu:
          type: string
          minLength: 1
          maxLength: 500
          description: A Russian example. Spaces at the ends are removed; then it has 1 to 500 characters, and no control, line-break or text-direction character.
        meaningRu:
          type: string
          minLength: 1
          maxLength: 200
          description: The meaning in Russian. Spaces at the ends are removed; then it has 1 to 200 characters, and no control, line-break or text-direction character.
        alternativesPl:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: At most 8 other Polish terms. Spaces at the ends of each term are removed; then each term has 1 to 200 characters, and no control, line-break or text-direction character. An empty list removes all terms.
        alternativesRu:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: At most 8 other Russian terms. Spaces at the ends of each term are removed; then each term has 1 to 200 characters, and no control, line-break or text-direction character. An empty list removes all terms.
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
