openapi: 3.1.0
info:
  title: Jak tam to słowo API
  version: 0.1.0
servers:
  - url: https://api.slowo.rustatian.me
  - url: https://api-dev.slowo.rustatian.me
security:
  - cognito: []
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user.
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateMe
      summary: Change the profile fields that the body names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: The changed user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/me/ai-consent:
    put:
      operationId: giveAiConsent
      summary: Give the AI consent. A second call keeps the first consent time.
      responses:
        "204":
          description: The consent is stored.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: withdrawAiConsent
      summary: Withdraw the AI consent.
      responses:
        "204":
          description: The user has no AI consent.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups:
    post:
      operationId: createGroup
      summary: Create a group. The signed-in user becomes its first member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroup
      summary: A group that the signed-in user is a member of.
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateGroup
      summary: Change the group fields that the body names.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: The changed group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listGroupMembers
      summary: The members of the group.
      responses:
        "200":
          description: The members, in the Polish order of display name, then by ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMembers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: removeGroupMember
      summary: Remove a member. A member who names their own ID leaves. The group is deleted with its last member.
      responses:
        "204":
          description: The user is not a member any more.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/invitations:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: createInvitation
      summary: Invite a person to the group by email. A pending invitation of the same address is replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: The new invitation. Its token is only in the email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
    get:
      operationId: listInvitations
      summary: The pending invitations of the group.
      responses:
        "200":
          description: The pending invitations, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitations"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/groups/{groupId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      operationId: cancelInvitation
      summary: Cancel a pending invitation.
      responses:
        "204":
          description: The invitation does not exist any more.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      description: The ID of a user (the id of Me and of Member).
      schema:
        type: string
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request body is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The request has no valid access token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The signed-in user is not a member of the group.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: The email service did not accept the message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Direction:
      type: string
      enum: [ru-pl, pl-ru]
      description: The translation direction of the learner's study.
    Me:
      type: object
      required: [id, email, displayName, direction, reminder]
      properties:
        id:
          type: string
          description: The Cognito user ID (the sub claim of the access token).
        email:
          type: string
          description: The email of the Cognito user.
        displayName:
          type: string
          description: The name that the group sees. Empty until the learner sets it.
        direction:
          $ref: "#/components/schemas/Direction"
        reminder:
          type: boolean
          description: The local reminder for due cards is on.
        aiConsentAt:
          type: string
          format: date-time
          description: When the user gave the AI consent. Absent without consent.
        groupId:
          type: string
          description: The group of the user. Absent without a group.
    MeUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: The new display name. Spaces at the ends are removed; then it has 1 to 40 characters and no control character.
        direction:
          $ref: "#/components/schemas/Direction"
        reminder:
          type: boolean
    Group:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    GroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: The group name. Spaces at the ends are removed; then it has 1 to 40 characters and no control character.
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: The new group name. Spaces at the ends are removed; then it has 1 to 40 characters and no control character.
    Member:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          description: The ID of the user.
        displayName:
          type: string
          description: The name that the group sees. Empty until the member sets it.
    GroupMembers:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    Invitation:
      type: object
      required: [id, email, createdAt, expiresAt]
      properties:
        id:
          type: string
        email:
          type: string
          description: The address that the invitation went to, in lower case.
        invitedBy:
          $ref: "#/components/schemas/Member"
          description: The member who sent the invitation. Absent when that account does not exist any more.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: The invitation can be accepted until this time.
    InvitationCreate:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
          description: One email address in ASCII characters. Spaces at the ends are removed, and capital letters become small letters.
    Invitations:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
