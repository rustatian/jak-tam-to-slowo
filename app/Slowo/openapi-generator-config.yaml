generate:
  - types
  - client
namingStrategy: idiomatic
accessModifier: internal
# The app generates only the paths that it calls; add a path here when the app starts to use it.
filter:
  paths:
    - /v1/me
    - /v1/me/ai-consent
    - /v1/groups
    - /v1/groups/{groupId}
    - /v1/groups/{groupId}/members
    - /v1/groups/{groupId}/members/{userId}
    - /v1/groups/{groupId}/invitations
    - /v1/groups/{groupId}/invitations/{invitationId}
    - /v1/groups/{groupId}/cards
    - /v1/invitations/{token}
    - /v1/invitations/{token}/acceptance
