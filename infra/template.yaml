AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Backend of Jak tam to słowo (stacks slowo-dev and slowo-prod).

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The zone slowo.rustatian.me (stack slowo-shared).
  # The repository is public, so the address is a stack parameter.
  AlarmEmail:
    Type: String
    NoEcho: true
    Description: The email address that gets the alarms of the stack.

Conditions:
  IsProd: !Equals [!Ref Stage, prod]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub slowo-${Stage}
      UserPoolTier: ESSENTIALS
      # Sign-up is open, and PreSignUpFunction lets only a request with the token of a pending invitation pass.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      # A changed email takes effect only after its code is verified, because the email is the sign-in name.
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Password reset emails also use the code template.
      # https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pool-settings-message-customizations.html
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Kod do aplikacji Jak tam to słowo?
        EmailMessage: "Twój kod weryfikacyjny: {####}. Jeżeli to nie Ty, zignoruj tę wiadomość."
      # DEVELOPER makes Cognito create its SES service-linked role; the identity needs no sending policy.
      # https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pool-settings-message-customizations.html
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/slowo.rustatian.me
        From: noreply@slowo.rustatian.me

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: ios
      GenerateSecret: false
      # Rotation needs the REFRESH_TOKEN_AUTH flow off; the app refreshes with GetTokensFromRefreshToken.
      # https://docs.aws.amazon.com/cognito/latest/developerguide/amazon-cognito-user-pools-using-the-refresh-token.html
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH]
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 60
      RefreshTokenValidity: 365
      TokenValidityUnits:
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !If [IsProd, api.slowo.rustatian.me, api-dev.slowo.rustatian.me]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !If [IsProd, api.slowo.rustatian.me, api-dev.slowo.rustatian.me]
          HostedZoneId: !Ref HostedZoneId

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          # Cognito access tokens have no aud claim; API Gateway then checks client_id against the audience.
          # https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-jwt-authorizer.html
          Cognito:
            IdentitySource: $request.header.Authorization
            AuthorizationScopes: [aws.cognito.signin.user.admin]
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]
      Domain:
        DomainName: !If [IsProd, api.slowo.rustatian.me, api-dev.slowo.rustatian.me]
        CertificateArn: !Ref Certificate
        Route53:
          HostedZoneId: !Ref HostedZoneId

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  # Amazon SES publishes the bounces and the complaints of the emails that go out with this configuration set.
  # Only the default event bus can be the destination.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-ses-configurationseteventdestination-eventbridgedestination.html
  MailConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub slowo-${Stage}

  MailEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref MailConfigurationSet
      EventDestination:
        Name: eventbridge
        Enabled: true
        MatchingEventTypes: [BOUNCE, COMPLAINT]
        EventBridgeDestination:
          EventBusArn: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default

  MailEventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  PreSignUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  # The subscription sends a confirmation email first. Alarms reach the address only after the confirmation.
  # SNS deletes a subscription that is not confirmed in 48 hours, and a stack update without changes does not
  # make it again.
  # https://docs.aws.amazon.com/sns/latest/dg/sns-email-notifications.html
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub slowo-${Stage}-alarms
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # A failed run of the events function leaves expired invitations in the database or a bounce without its mark.
  # The Errors metric has no value while the function does not run, so missing data counts as good.
  # Lambda runs a failed event two more times within 3 minutes, so with a period of 5 minutes one failed event
  # gives one alarm.
  # https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-error-handling.html
  MailEventsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub slowo-${Stage}-mail-events-errors
      AlarmDescription: The events function of the invitations returned an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref MailEventsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  Cluster:
    Type: AWS::DSQL::Cluster
    Properties:
      DeletionProtectionEnabled: !If [IsProd, true, false]

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ../backend/cmd/api
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          DSQL_ENDPOINT: !GetAtt Cluster.Endpoint
          USER_POOL_ID: !Ref UserPool
          MAIL_FROM: noreply@slowo.rustatian.me
          MAIL_CONFIGURATION_SET: !Ref MailConfigurationSet
      # The database role app maps to this role (cmd/migrate); dsql:DbConnect allows no admin connection.
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnect
              Resource: !GetAtt Cluster.ResourceArn
            - Effect: Allow
              Action: cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
            # The identity of the sender domain is in the stack slowo-shared. A send with a configuration set needs
            # the right on the set too.
            # https://docs.aws.amazon.com/service-authorization/latest/reference/list_sesv2.html
            - Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/slowo.rustatian.me
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${MailConfigurationSet}
      Events:
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/me
            Method: GET
        PatchMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/me
            Method: PATCH
        PutAiConsent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/me/ai-consent
            Method: PUT
        DeleteAiConsent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/me/ai-consent
            Method: DELETE
        CreateGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groups
            Method: POST
        GetGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groups/{groupId}
            Method: GET
        PatchGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groups/{groupId}
            Method: PATCH
        ListGroupMembers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groups/{groupId}/members
            Method: GET
        RemoveGroupMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groups/{groupId}/members/{userId}
            Method: DELETE
        CreateInvitation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groups/{groupId}/invitations
            Method: POST
        ListInvitations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groups/{groupId}/invitations
            Method: GET
        CancelInvitation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groups/{groupId}/invitations/{invitationId}
            Method: DELETE
        PreviewInvitation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/invitations/{token}
            Method: GET
            # The token of the invitation link is the proof, so the route has no authorizer.
            Auth:
              Authorizer: NONE
            # The route works without sign-in and reads the database, so it has its own request limit.
            # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-property-function-httpapi.html
            RouteSettings:
              ThrottlingBurstLimit: 10
              ThrottlingRateLimit: 5
        AcceptInvitation:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/invitations/{token}/acceptance
            Method: POST
        CreateCard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groups/{groupId}/cards
            Method: POST
        ListCards:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groups/{groupId}/cards
            Method: GET
        PatchCard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/groups/{groupId}/cards/{cardId}
            Method: PATCH

  # Cognito calls this function before each sign-up and waits at most 5 seconds for its answer.
  # https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-working-with-lambda-triggers.html#important-lambda-considerations
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ../backend/cmd/presignup
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      LoggingConfig:
        LogGroup: !Ref PreSignUpLogGroup
      Environment:
        Variables:
          DSQL_ENDPOINT: !GetAtt Cluster.Endpoint
      # The function has its own role, because the role of the API function names the user pool and the user pool
      # names this function. cmd/migrate maps the database role app to this role too.
      Policies:
        - Statement:
            - Effect: Allow
              Action: dsql:DbConnect
              Resource: !GetAtt Cluster.ResourceArn
      Events:
        SignUp:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PreSignUp

  MailEventsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ../backend/cmd/mailevents
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref MailEventsLogGroup
      Environment:
        Variables:
          DSQL_ENDPOINT: !GetAtt Cluster.Endpoint
      # The database role app maps to the role of the API function, so this function runs with that role.
      Role: !GetAtt ApiFunctionRole.Arn
      Events:
        MailEvent:
          Type: EventBridgeRule
          Properties:
            # Dev and prod share the default event bus. The tag names the configuration set of the email.
            # https://docs.aws.amazon.com/ses/latest/dg/monitoring-eventbridge.html
            Pattern:
              source: [aws.ses]
              detail-type: [Email Bounced, Email Complaint Received]
              detail:
                mail:
                  tags:
                    "ses:configuration-set": [!Ref MailConfigurationSet]
        ExpiredInvitations:
          Type: ScheduleV2
          Properties:
            # The function gets the Input as its event. A rate schedule has its first run when it is created.
            # https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html#rate-based
            Name: !Sub slowo-${Stage}-expired-invitations
            ScheduleExpression: rate(1 day)
            Input: '{"detail-type": "Scheduled Event"}'

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ApiUrl:
    Value: !Sub
      - https://${Domain}
      - Domain: !If [IsProd, api.slowo.rustatian.me, api-dev.slowo.rustatian.me]
  ClusterEndpoint:
    Value: !GetAtt Cluster.Endpoint
  ApiFunctionRoleArn:
    Value: !GetAtt ApiFunctionRole.Arn
  PreSignUpFunctionRoleArn:
    Value: !GetAtt PreSignUpFunctionRole.Arn
