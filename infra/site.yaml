AWSTemplateFormatVersion: '2010-09-09'
Description: The static site of the vocabulary app at slowo.rustatian.me, on S3 and CloudFront.

Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: The zone slowo.rustatian.me of the stack slowo-shared in eu-central-1.

Resources:
  # CloudFront takes a certificate only from us-east-1, so this stack is in that region.
  # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html#https-requirements-aws-region
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: slowo.rustatian.me
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: slowo.rustatian.me
          HostedZoneId: !Ref HostedZoneId

  # By default, new buckets allow no public access and encrypt new objects.
  # https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
  # https://docs.aws.amazon.com/AmazonS3/latest/userguide/default-bucket-encryption.html
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub slowo-site-${AWS::AccountId}

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: slowo-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Every invitation link shows the same page; the token stays in the address for the app. A path with a dot
  # is a file, and that covers every path under /.well-known/. Other paths are directories with an index.html.
  # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/example_cloudfront_functions_url_rewrite_single_page_apps_section.html
  PathsFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: slowo-site-paths
      AutoPublish: true
      FunctionConfig:
        Comment: Maps invitation links and directory paths to their pages
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        async function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/invite' || uri.startsWith('/invite/')) {
            request.uri = '/invite/index.html';
          } else if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.includes('.')) {
            request.uri += '/index.html';
          }
          return request;
        }

  # An invitation address has the token in its path, so the site sends no referrer. The pages have no script.
  # Only a registered domain can be on the HSTS preload list, so the header has no preload.
  HeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: slowo-site-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'geolocation=(), microphone=(), camera=()'
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true
            - Header: Cross-Origin-Resource-Policy
              Value: same-origin
              Override: true

  # The distribution writes no access log, so no log has the token of an invitation address.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - slowo.rustatian.me
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # The managed cache policy CachingOptimized.
          # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#managed-cache-caching-optimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref HeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt PathsFunction.FunctionARN
        # Without s3:ListBucket, S3 answers 403 for a missing key.
        # https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404/index.html

  # Z2FDTNDATAQYW2 is the hosted zone ID of every CloudFront alias target.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-route53-recordset-aliastarget.html#cfn-route53-recordset-aliastarget-hostedzoneid
  SiteRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: slowo.rustatian.me
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: slowo.rustatian.me
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

  # The site workflow can only upload the site and clear the cache. A person deploys this stack.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: slowo-site-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Created by the Terraform in rapira-rs/benchmarks (terraform/ci). This stack must not declare it.
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                # The repository uses immutable subject claims: https://docs.github.com/en/actions/reference/security/oidc#immutable-subject-claims
                'token.actions.githubusercontent.com:sub': 'repo:rustatian@8040338/jak-tam-to-slowo@1426008841:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${Bucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
