version = 0.1

[default.global.parameters]
# A stack keeps the name of its first deploy: CloudFormation has no rename operation.
# https://aws.amazon.com/blogs/infrastructure-and-automation/keep-your-aws-resources-when-you-rename-an-aws-cloudformation-stack/
stack_name = "slowo-dev"
region = "eu-central-1"

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
s3_prefix = "slowo-dev"
parameter_overrides = "HostedZoneId=Z04265433BT9IC08IEBW6"
